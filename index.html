<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>打字练习 · Typing Practice</title>
<style>
  :root{
    --bg:#0a0b10;
    --panel:#12151d;
    --line:#1e2330;
    --fg:#e8ebf5;
    --dim:#6a7189;
    --dim2:#3c4356;
    --accent:#5ad1e6;
    --good:#7ee2a8;
    --bad:#ff5577;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --tsize: clamp(13px, calc((100vw - 56px) / 33), 27px);
    --ksize: clamp(25px, 3.3vw, 44px);
    --gap: 6px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    padding: clamp(18px,4vh,52px) 20px 28px;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(1100px 620px at 50% -12%, #17203a 0%, rgba(10,11,16,0) 62%),
      radial-gradient(900px 500px at 50% 110%, #101827 0%, rgba(10,11,16,0) 60%),
      var(--bg);
    color:var(--fg);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* margin:auto 垂直居中；内容超高时自动退化为 0，不会裁掉顶部 */
  .app{ width:min(1120px,100%); margin:auto; }

  /* ---------- HUD ---------- */
  .hud{
    display:flex; align-items:flex-end; gap:clamp(14px,3.4vw,46px);
    padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.045);
  }
  .stat{ min-width:0; }
  .stat .label{
    font-size:10.5px; letter-spacing:.1em; color:var(--dim);
    white-space:nowrap; margin-bottom:5px;
  }
  .stat .value{
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:clamp(19px,2.3vw,29px); font-weight:600; line-height:1;
    display:flex; align-items:baseline; gap:4px; color:var(--fg);
  }
  .stat .unit{ font-size:10.5px; font-weight:400; color:var(--dim); letter-spacing:.06em; }
  .stat.grow{ flex:1; min-width:110px; }
  .stat.grow b{ color:var(--fg); font-weight:600; }
  .bar{ height:4px; border-radius:99px; background:#181d29; overflow:hidden; margin-top:9px; }
  .bar i{ display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,#3fa8bd,#7ee2a8); transition:width .4s cubic-bezier(.2,.8,.2,1); }

  /* ---------- 文本舞台 ---------- */
  .stage{ position:relative; margin-top:clamp(16px,3.5vh,38px); }
  .lines{
    font-family:var(--mono); font-size:var(--tsize); letter-spacing:.01em;
    width:54ch; max-width:100%; margin:0 auto; min-height:5.25em;
    user-select:none; -webkit-user-select:none;
  }
  .line{ white-space:pre; height:1.75em; line-height:1.75em; }
  .line.prev{ opacity:.45; }
  .line.next{ opacity:.6; }
  .line.prev .ch,.line.next .ch{ color:var(--dim2); }
  .ch{ color:#565e75; transition:color .1s linear; }
  .ch.o{ color:var(--fg); }
  .ch.b{
    color:var(--bad); text-decoration:underline; text-underline-offset:.22em;
    text-decoration-thickness:2px; background:rgba(255,85,119,.13); border-radius:3px;
  }
  .ch.cur{
    color:#fff; background:rgba(90,209,230,.16); border-radius:3px;
    box-shadow:inset 0 -2px 0 0 var(--accent);
  }
  .hint{
    position:absolute; inset:-10px -6px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; pointer-events:none;
    background:#0d1018; border:1px solid #1a2030; border-radius:14px;
    box-shadow:0 24px 60px -34px #000;
    transition:opacity .3s ease, visibility .3s;
  }
  .hint.hidden{ opacity:0; visibility:hidden; }
  .hint-title{ font-size:clamp(17px,2vw,22px); font-weight:600; letter-spacing:.02em; }
  .hint-sub{ font-size:12px; color:var(--dim); letter-spacing:.04em; }
  .hint-keys{
    margin-top:10px; font-family:var(--mono); font-size:12px; letter-spacing:.22em;
    color:var(--accent); opacity:.85;
  }

  /* ---------- 键盘 ---------- */
  .kbd{ display:flex; flex-direction:column; align-items:center; gap:var(--gap);
    margin:clamp(18px,4vh,40px) 0 0; user-select:none; -webkit-user-select:none; }
  .krow{ display:flex; gap:var(--gap); }
  .krow1{ padding-left:calc((var(--ksize) + var(--gap)) * .5); }
  .krow2{ padding-left:calc(var(--ksize) + var(--gap)); }
  .key{
    position:relative; width:var(--ksize); height:var(--ksize); flex:none;
    display:grid; place-items:center; border-radius:9px;
    background:linear-gradient(180deg,#171b25,#12151d);
    border:1px solid #212736; color:#7c8399;
    font-size:calc(var(--ksize) * .34); font-weight:600; text-transform:lowercase;
    transition:background .1s, color .1s, box-shadow .15s, transform .06s, border-color .15s;
  }
  .key .dot{
    position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%;
    background:var(--f); opacity:.5;
  }
  .key.locked{ opacity:.2; }
  .key.next{
    color:#06222a; background:var(--accent); border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(90,209,230,.5), 0 0 22px -4px rgba(90,209,230,.75);
    transform:translateY(-1px);
  }
  .key.next .dot{ opacity:0; }
  .key.hit{ background:#2a3244; color:#c9d2e6; }
  .key.miss{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .key.space{ width:calc(var(--ksize) * 6.5); }
  .key.space .kch{ font-size:10px; letter-spacing:.16em; color:inherit; }

  /* ---------- 底栏 ---------- */
  .foot{ display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap; margin-top:min(9vh,54px); }
  .letters{ display:flex; gap:4px; flex-wrap:wrap; }
  .letter{
    width:17px; height:17px; border-radius:4px; display:grid; place-items:center;
    font-family:var(--mono); font-size:9px; line-height:1;
    background:#111520; border:1px solid #1c2130; color:#2f3646; text-transform:lowercase;
  }
  .letter.on{ background:var(--f); border-color:transparent; color:#0a0d14; font-weight:700; }
  .tools{ display:flex; gap:8px; flex-wrap:wrap; }
  .tool{
    appearance:none; font-family:inherit; font-size:11.5px; letter-spacing:.02em;
    padding:7px 12px; border-radius:8px; cursor:pointer;
    color:#8c93aa; background:#131721; border:1px solid #212736;
    transition:.14s;
  }
  .tool:hover{ color:var(--fg); border-color:#333c52; background:#171c28; }
  .tool.on{ color:#06251a; background:var(--good); border-color:transparent; font-weight:600; }
  .tool.danger:hover{ color:var(--bad); border-color:#4a1f2a; }

  .toast{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,14px);
    padding:10px 18px; border-radius:10px; font-size:13px; letter-spacing:.03em;
    color:var(--good); background:rgba(14,20,30,.95); border:1px solid #26384a;
    box-shadow:0 18px 40px -18px #000; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:640px){
    .hud{ flex-wrap:wrap; gap:14px 20px; }
    .stat.grow{ order:9; flex-basis:100%; }
    .kbd{ display:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="hud">
    <div class="stat"><div class="label">速度</div>
      <div class="value"><span id="s-wpm">0</span><span class="unit">wpm</span></div></div>
    <div class="stat"><div class="label">准确率</div>
      <div class="value"><span id="s-acc">—</span><span class="unit">%</span></div></div>
    <div class="stat"><div class="label">一致性</div>
      <div class="value"><span id="s-cons">—</span><span class="unit">%</span></div></div>
    <div class="stat"><div class="label">用时</div>
      <div class="value"><span id="s-time">0:00</span></div></div>
    <div class="stat grow">
      <div class="label">等级 <b id="s-level">8</b>/26 · 最佳 <b id="s-best">0</b> wpm</div>
      <div class="bar"><i id="lesson-bar"></i></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="lines" id="lines"></div>
    <div class="hint" id="hint">
      <div class="hint-title">开始输入</div>
      <div class="hint-sub">第一次按键开始计时 · 空格换词 · Esc 重开</div>
      <div class="hint-keys" id="hint-keys"></div>
    </div>
  </main>

  <section class="kbd" id="kbd" aria-hidden="true"></section>

  <footer class="foot">
    <div class="letters" id="letters" title="已解锁的字母"></div>
    <div class="tools">
      <button class="tool" id="btn-sound" type="button">声音</button>
      <button class="tool" id="btn-strict" type="button">严格模式</button>
      <button class="tool" id="btn-restart" type="button">重来 Esc</button>
      <button class="tool danger" id="btn-reset" type="button">重置进度</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  var LETTER_ORDER = ['f','j','d','k','s','l','a','g','h','r','u','e','i','w','o','q','p','t','y','b','n','m','v','c','x','z'];
  var START_LEVEL    = 8;      // 起手解锁的字母数（主行 f j d k s l a g）
  var LINE_TARGET    = 46;     // 每行目标字符数
  var UNLOCK_EVERY   = 40;     // 每 40 次按键考核一次
  var UNLOCK_ACC     = 0.95;   // 考核门槛：准确率 ≥ 95%
  var IDLE_CAP       = 1200;   // 单次停顿最多计入 1.2s（防止发呆拉低速度）
  var SAVE_KEY       = 'dsh-typing-practice-v1';

  /* ================= 语料（用于 bigram 建模 + 真词） ================= */
  var WORD_SRC = 'the of and a to in is you that it he was for on are as with his they at be this have from or ' +
    'one had by but not what all were we when your can said there use an each which she do how their if will up ' +
    'other about out many then them these so some her would make like him into time has look two more write go see ' +
    'number no way could people my than first water been call who its now find long down day did get come made may ' +
    'part over new sound take only little work know place year live me back give most very after thing our just ' +
    'name good sentence man think say great where help through much before line right too mean old any same tell ' +
    'boy follow came want show also around form three small set put end does another well large must big even such ' +
    'because turn here why ask went men read need land different home us move try kind hand picture again change ' +
    'off play spell air away animal house point page letter mother answer found study still learn should world ' +
    'high every near add food between own below country plant last school father keep tree never start city eye ' +
    'light thought head under story saw left few while along might close something seem next hard open example ' +
    'begin life always those both paper together got group often run word book hear stop without second later ' +
    'miss idea enough eat face watch far really almost let above girl sometimes mountain cut young talk soon list ' +
    'song being leave family ' +
    // 主行/简单短词：保证低等级也能打真词
    'sad lad dad bad fad fads gas gal gala gals gag gags flag flags flak flask flask glass salad dash gash lash ' +
    'hash jag jags slag glad skid skip kid kids keg key desk asks adds alls falls halls lasts lads dads jabs ' +
    'gabs fabs sags sass lass lasses asks salad flashes';
  var WORDS = (function () {
    var seen = Object.create(null), out = [];
    WORD_SRC.split(' ').forEach(function (w) {
      if (w && !seen[w]) { seen[w] = 1; out.push(w); }
    });
    return out;
  })();

  var BI = Object.create(null);   // 双字模型：前一个字 -> { 后一个字: 次数 }
  var UNI = Object.create(null);  // 单字频率
  var LEN_TABLE = [3, 3, 3, 4, 4, 4, 4, 5, 5, 6];

  (function buildModel() {
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      for (var j = 0; j < w.length; j++) {
        UNI[w[j]] = (UNI[w[j]] || 0) + 1;
        if (j < w.length - 1) {
          var a = w[j], b = w[j + 1];
          if (!BI[a]) BI[a] = Object.create(null);
          BI[a][b] = (BI[a][b] || 0) + 1;
        }
      }
    }
  })();

  /* ================= 手指配色 ================= */
  var FINGERS = [
    { keys: 'qaz',       color: '#ff7b8a' },
    { keys: 'wsx',       color: '#ffb066' },
    { keys: 'edc',       color: '#ffe066' },
    { keys: 'rfvtgb',    color: '#8ce99a' },
    { keys: 'yhnujm',    color: '#66d9e8' },
    { keys: 'ik',        color: '#74c0fc' },
    { keys: 'ol',        color: '#b197fc' },
    { keys: 'p',         color: '#f783ac' },
    { keys: ' ',         color: '#adb5bd' }
  ];
  var FINGER_OF = Object.create(null);
  FINGERS.forEach(function (f) {
    for (var i = 0; i < f.keys.length; i++) FINGER_OF[f.keys[i]] = f.color;
  });

  var KB_ROWS = [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['z','x','c','v','b','n','m']
  ];

  /* ================= DOM ================= */
  var $ = function (s) { return document.querySelector(s); };
  var elLines    = $('#lines');
  var elHint     = $('#hint');
  var elKbd      = $('#kbd');
  var elLetters  = $('#letters');
  var elToast    = $('#toast');
  var elWpm      = $('#s-wpm');
  var elAcc      = $('#s-acc');
  var elCons     = $('#s-cons');
  var elTime     = $('#s-time');
  var elLevel    = $('#s-level');
  var elBest     = $('#s-best');
  var elBar      = $('#lesson-bar');
  var elHintKeys = $('#hint-keys');

  /* ================= 状态 ================= */
  var state = {
    level: START_LEVEL,
    alphabet: '',
    allow: null,
    buffer: [],      // 已生成的行文本
    status: [],      // 每行每个字符：'p' 待输入 / 'o' 正确 / 'b' 错误
    lineIndex: 0,
    col: 0,
    running: false,
    startTs: 0,
    elapsedMs: 0,
    lastTs: 0,
    keystrokes: 0,
    correct: 0,
    errors: 0,
    correctChars: 0,
    intervals: [],
    sinceUnlock: 0,
    sinceUnlockCorrect: 0,
    best: 0,
    settings: { sound: true, strict: false }
  };

  var lineSpans = new Map();  // 行号 -> [span]
  var cursorEl = null;
  var keyEls = Object.create(null);
  var realWords = [];
  var toastTimer = 0;

  /* ================= 键盘 ================= */
  function buildKeyboard() {
    KB_ROWS.forEach(function (row, ri) {
      var r = document.createElement('div');
      r.className = 'krow krow' + ri;
      row.forEach(function (ch) {
        r.appendChild(makeKey(ch, ch));
      });
      elKbd.appendChild(r);
    });
    var row = document.createElement('div');
    row.className = 'krow';
    row.appendChild(makeKey(' ', 'space'));
    elKbd.appendChild(row);
  }

  function makeKey(ch, cls) {
    var k = document.createElement('div');
    k.className = 'key' + (cls ? ' ' + cls : '');
    k.dataset.ch = ch;
    var label = document.createElement('span');
    label.className = 'kch';
    label.textContent = ch === ' ' ? 'space' : ch;
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.setProperty('--f', FINGER_OF[ch] || '#adb5bd');
    k.appendChild(label);
    k.appendChild(dot);
    keyEls[ch] = k;
    return k;
  }

  function paintKeyboardLocks() {
    for (var ch in keyEls) {
      if (ch === ' ') continue;
      keyEls[ch].classList.toggle('locked', state.alphabet.indexOf(ch) === -1);
    }
  }

  function highlightNext(ch) {
    for (var k in keyEls) keyEls[k].classList.remove('next');
    if (ch && keyEls[ch]) keyEls[ch].classList.add('next');
  }

  function flashKey(ch, ok) {
    var k = keyEls[ch];
    if (!k) return;
    k.classList.add(ok ? 'hit' : 'miss');
    clearTimeout(k.__t);
    k.__t = setTimeout(function () { k.classList.remove('hit', 'miss'); }, 110);
  }

  /* ================= 单词生成 ================= */
  function refreshRealWords() {
    realWords = WORDS.filter(function (w) {
      if (w.length < 2) return false;
      for (var i = 0; i < w.length; i++) {
        if (!state.allow.has(w[i])) return false;
      }
      return true;
    });
  }

  function weighted(pairs) {
    var total = 0, i;
    for (i = 0; i < pairs.length; i++) total += pairs[i][1];
    var r = Math.random() * total;
    for (i = 0; i < pairs.length; i++) {
      r -= pairs[i][1];
      if (r <= 0) return pairs[i][0];
    }
    return pairs[pairs.length - 1][0];
  }

  var recent = [];   // 近期用过的词，避免原地打转
  function remember(w) {
    recent.push(w);
    if (recent.length > 12) recent.shift();
  }
  function isFresh(w) { return recent.indexOf(w) === -1; }

  function pseudoWord() {
    var allowed = state.alphabet;
    var len = LEN_TABLE[(Math.random() * LEN_TABLE.length) | 0];
    var out = '', prev = '', i, j, ch;
    for (i = 0; i < len; i++) {
      var opts = [];
      var row = prev ? BI[prev] : null;
      if (row) {
        for (ch in row) {
          if (!state.allow.has(ch)) continue;
          if (ch === prev) continue;              // 不出现叠字
          opts.push([ch, row[ch]]);
        }
      }
      if (!opts.length) {
        for (j = 0; j < allowed.length; j++) {
          ch = allowed[j];
          if (ch === prev) continue;
          opts.push([ch, UNI[ch] || 1]);
        }
      }
      if (!opts.length) break;
      var pick = weighted(opts);
      out += pick;
      prev = pick;
    }
    return out;
  }

  function genWord() {
    var i, w;
    // 真词优先：宁可真实，也不生造
    if (realWords.length >= 4 && Math.random() < 0.6) {
      var pool = realWords.filter(isFresh);
      if (!pool.length) pool = realWords;
      w = pool[(Math.random() * pool.length) | 0];
      remember(w);
      return w;
    }
    for (i = 0; i < 12; i++) {
      w = pseudoWord();
      if (w.length >= 3 && isFresh(w)) { remember(w); return w; }
    }
    w = pseudoWord();
    remember(w);
    return w;
  }

  function makeLine() {
    var parts = [];
    var n = 0, guard = 0;
    while (n < LINE_TARGET && guard++ < 240) {
      var w = genWord();
      if (parts.length && w === parts[parts.length - 1]) continue;
      parts.push(w);
      n += w.length + 1;
    }
    return parts.join(' ');
  }

  function addLine() {
    var text = makeLine();
    state.buffer.push(text);
    var st = [];
    for (var i = 0; i < text.length; i++) st.push('p');
    state.status.push(st);
  }

  /* ================= 渲染文本 ================= */
  function renderWindow() {
    while (state.buffer.length < state.lineIndex + 2) addLine();
    lineSpans = new Map();
    cursorEl = null;
    elLines.innerHTML = '';

    // 起始时没有上一行，用空行占位，保证光标恒在中间那一行
    if (state.lineIndex === 0) {
      var ph = document.createElement('div');
      ph.className = 'line prev';
      elLines.appendChild(ph);
    }

    for (var i = state.lineIndex - 1; i <= state.lineIndex + 1; i++) {
      if (i < 0 || i >= state.buffer.length) continue;
      var div = document.createElement('div');
      div.className = 'line ' + (i < state.lineIndex ? 'prev' : (i > state.lineIndex ? 'next' : 'cur'));

      var chars = state.buffer[i].split('');
      var spans = [];
      for (var c = 0; c < chars.length; c++) {
        var s = document.createElement('span');
        s.className = 'ch';
        var st = state.status[i][c];
        if (st === 'o') s.classList.add('o');
        else if (st === 'b') s.classList.add('b');
        s.textContent = chars[c];
        div.appendChild(s);
        spans.push(s);
      }
      elLines.appendChild(div);
      lineSpans.set(i, spans);
    }
    setCursor();
  }

  function setCursor() {
    if (cursorEl) { cursorEl.classList.remove('cur'); cursorEl = null; }
    var spans = lineSpans.get(state.lineIndex);
    if (spans) {
      var s = spans[state.col];
      if (s) { s.classList.add('cur'); cursorEl = s; }
    }
    highlightNext(expectedChar());
  }

  function expectedChar() {
    var line = state.buffer[state.lineIndex];
    if (line == null) return null;
    var ch = line[state.col];
    return ch === undefined ? null : ch;
  }

  /* ================= 统计 ================= */
  function consistency() {
    var arr = state.intervals;
    if (arr.length < 6) return null;
    var sum = 0, i;
    for (i = 0; i < arr.length; i++) sum += arr[i];
    var mean = sum / arr.length;
    if (mean <= 0) return null;
    var v = 0;
    for (i = 0; i < arr.length; i++) v += (arr[i] - mean) * (arr[i] - mean);
    var sd = Math.sqrt(v / arr.length);
    var score = 1 - sd / mean;
    return Math.max(0, Math.min(1, score));
  }

  function elapsed() {
    if (state.running && state.startTs) return performance.now() - state.startTs;
    return state.elapsedMs;
  }

  function metrics() {
    // 1.2s 下限：避免开局前几十毫秒算出几千 WPM
    var mins = Math.max(elapsed(), 1200) / 60000;
    var wpm = state.correctChars ? (state.correctChars / 5) / mins : 0;
    var acc = state.keystrokes ? state.correct / state.keystrokes : 1;
    return { wpm: wpm, acc: acc, cons: consistency() };
  }

  function mmss(ms) {
    var t = Math.floor(ms / 1000);
    var m = Math.floor(t / 60);
    var s = t % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderStats() {
    var m = metrics();
    elWpm.textContent = String(Math.round(m.wpm));
    elAcc.textContent = state.keystrokes ? (m.acc >= 0.9995 ? '100' : (m.acc * 100).toFixed(1)) : '—';
    elCons.textContent = m.cons == null ? '—' : String(Math.round(m.cons * 100));
    elTime.textContent = mmss(elapsed());
  }

  // 最佳成绩按“整段练习”结算，而不是实时最高瞬时速度
  function finalizeSession() {
    if (state.keystrokes < 20) return;
    var w = Math.round(metrics().wpm);
    if (w > state.best) {
      state.best = w;
      elBest.textContent = String(w);
    }
  }

  /* ================= 声音 ================= */
  var actx = null;
  function beep(kind) {
    if (!state.settings.sound) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.connect(g);
      g.connect(actx.destination);
      if (kind === 'error') {
        o.type = 'square';
        o.frequency.setValueAtTime(150, t);
        g.gain.setValueAtTime(0.045, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
        o.start(t); o.stop(t + 0.12);
      } else if (kind === 'unlock') {
        o.type = 'sine';
        o.frequency.setValueAtTime(660, t);
        o.frequency.exponentialRampToValueAtTime(990, t + 0.11);
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        o.start(t); o.stop(t + 0.3);
      } else {
        o.type = 'triangle';
        o.frequency.setValueAtTime(1150 + Math.random() * 220, t);
        g.gain.setValueAtTime(0.03, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
        o.start(t); o.stop(t + 0.05);
      }
    } catch (e) { /* 静默失败 */ }
  }

  /* ================= 提示条 ================= */
  function toast(msg) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove('show'); }, 1800);
  }

  /* ================= 等级 / 解锁 ================= */
  function setLevel(n) {
    state.level = Math.max(1, Math.min(LETTER_ORDER.length, n));
    state.alphabet = LETTER_ORDER.slice(0, state.level).join('');
    state.allow = new Set(state.alphabet.split(''));
    refreshRealWords();
    recent.length = 0;
    elLevel.textContent = String(state.level);
    elBar.style.width = Math.min(100, (state.level / LETTER_ORDER.length) * 100) + '%';
    paintKeyboardLocks();
    renderLetters();
    elHintKeys.textContent = '当前只练 ' + state.alphabet.split('').join(' ');
  }

  function renderLetters() {
    elLetters.innerHTML = '';
    LETTER_ORDER.forEach(function (ch, i) {
      var d = document.createElement('span');
      d.className = 'letter' + (i < state.level ? ' on' : '');
      d.style.setProperty('--f', FINGER_OF[ch] || '#adb5bd');
      d.textContent = ch;
      elLetters.appendChild(d);
    });
  }

  function maybeUnlock() {
    if (state.sinceUnlock < UNLOCK_EVERY) return;
    var acc = state.sinceUnlockCorrect / UNLOCK_EVERY;
    state.sinceUnlock = 0;
    state.sinceUnlockCorrect = 0;
    if (acc >= UNLOCK_ACC && state.level < LETTER_ORDER.length) {
      var next = LETTER_ORDER[state.level];
      setLevel(state.level + 1);
      beep('unlock');
      toast('解锁新字母 · ' + next.toUpperCase() + '　准确率 ' + Math.round(acc * 100) + '%');
      save();
    }
  }

  /* ================= 输入处理 ================= */
  function startSession() {
    state.running = true;
    state.lastTs = 0;
    state.startTs = performance.now();
    elHint.classList.add('hidden');
    // 过渡结束后彻底移出布局，避免残留遮罩影响渲染
    setTimeout(function () {
      if (state.running) elHint.style.display = 'none';
    }, 340);
  }

  function tick() {
    var now = performance.now();
    if (state.lastTs) {
      var dt = now - state.lastTs;
      if (dt > IDLE_CAP) dt = IDLE_CAP;
      state.intervals.push(dt);
      if (state.intervals.length > 100) state.intervals.shift();
    }
    state.lastTs = now;
    state.elapsedMs = now - state.startTs;
  }

  function commit(ci, ok) {
    var li = state.lineIndex;
    var spans = lineSpans.get(li);
    if (spans && spans[ci]) spans[ci].classList.add(ok ? 'o' : 'b');

    state.col = ci + 1;
    if (state.col >= state.buffer[li].length) {
      state.lineIndex += 1;
      state.col = 0;
      while (state.buffer.length < state.lineIndex + 2) addLine();
      renderWindow();
    } else {
      setCursor();
    }
  }

  function pressChar(ch) {
    if (!state.buffer.length) return;
    if (!state.running) startSession();

    var expected = expectedChar();
    if (expected == null) return;

    var li = state.lineIndex;
    var ci = state.col;
    var ok = ch === expected;

    state.keystrokes += 1;
    tick();

    if (ok) {
      state.correct += 1;
      state.correctChars += 1;
      state.sinceUnlock += 1;
      state.sinceUnlockCorrect += 1;
      state.status[li][ci] = 'o';
      flashKey(ch, true);
      beep('click');
      commit(ci, true);
    } else {
      state.errors += 1;
      flashKey(ch, false);
      beep('error');
      if (state.settings.strict) {
        var spans = lineSpans.get(li);
        if (spans && spans[ci]) {
          var s = spans[ci];
          s.classList.add('b');
          // 闪一下红就恢复；只有真正提交为错误时才保留
          setTimeout(function () {
            if (state.status[li][ci] !== 'b') s.classList.remove('b');
          }, 160);
        }
        highlightNext(expected);
        renderStats();
        return;
      }
      state.status[li][ci] = 'b';
      commit(ci, false);
    }

    renderStats();
    maybeUnlock();
  }

  function backspace() {
    if (!state.running || state.col === 0) return;
    state.col -= 1;
    var li = state.lineIndex;
    var ci = state.col;
    if (state.status[li][ci] === 'o') {
      state.correctChars = Math.max(0, state.correctChars - 1);
    }
    state.status[li][ci] = 'p';
    var spans = lineSpans.get(li);
    if (spans && spans[ci]) spans[ci].classList.remove('o', 'b');
    setCursor();
    renderStats();
  }

  /* ================= 会话 ================= */
  function restart() {
    finalizeSession();
    state.buffer = [];
    state.status = [];
    state.lineIndex = 0;
    state.col = 0;
    state.running = false;
    state.elapsedMs = 0;
    state.startTs = 0;
    state.lastTs = 0;
    state.keystrokes = 0;
    state.correct = 0;
    state.errors = 0;
    state.correctChars = 0;
    state.intervals = [];
    state.sinceUnlock = 0;
    state.sinceUnlockCorrect = 0;

    while (state.buffer.length < 3) addLine();
    renderWindow();
    renderStats();
    elHint.style.display = '';
    elHint.classList.remove('hidden');
    save();
  }

  /* ================= 持久化 ================= */
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        level: state.level,
        best: Math.round(state.best),
        settings: state.settings
      }));
    } catch (e) { /* 隐私模式忽略 */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (typeof d.level === 'number' && d.level >= 1 && d.level <= LETTER_ORDER.length) {
        state.level = d.level;
      }
      if (typeof d.best === 'number' && d.best > 0) {
        state.best = d.best;
        elBest.textContent = String(Math.round(d.best));
      }
      if (d.settings && typeof d.settings === 'object') {
        state.settings.sound = d.settings.sound !== false;
        state.settings.strict = d.settings.strict === true;
      }
    } catch (e) { /* 损坏则用默认值 */ }
  }

  /* ================= 设置按钮 ================= */
  function syncTools() {
    var bs = $('#btn-sound');
    bs.classList.toggle('on', state.settings.sound);
    bs.textContent = '声音 ' + (state.settings.sound ? '开' : '关');

    var bt = $('#btn-strict');
    bt.classList.toggle('on', state.settings.strict);
    bt.textContent = '严格模式 ' + (state.settings.strict ? '开' : '关');
  }

  function bindTools() {
    $('#btn-sound').addEventListener('click', function (e) {
      state.settings.sound = !state.settings.sound;
      syncTools(); save(); e.currentTarget.blur();
    });
    $('#btn-strict').addEventListener('click', function (e) {
      state.settings.strict = !state.settings.strict;
      syncTools(); save(); e.currentTarget.blur();
    });
    $('#btn-restart').addEventListener('click', function (e) {
      restart(); e.currentTarget.blur();
    });
    $('#btn-reset').addEventListener('click', function (e) {
      e.currentTarget.blur();
      if (!window.confirm('确定要重置等级和最佳记录吗？')) return;
      state.keystrokes = 0;   // 让 restart() 的结算跳过，避免把刚清掉的记录写回来
      state.best = 0;
      elBest.textContent = '0';
      setLevel(START_LEVEL);
      restart();
      save();
      toast('进度已重置');
    });
  }

  /* ================= 全局按键 ================= */
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.isComposing || e.keyCode === 229) return;

    if (e.key === 'Escape') {
      e.preventDefault();
      restart();
      return;
    }
    if (e.key === 'Backspace') {
      e.preventDefault();
      backspace();
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      pressChar(' ');
      return;
    }
    if (e.key.length === 1) {
      e.preventDefault();
      pressChar(e.key.toLowerCase());
    }
  }

  /* ================= 启动 ================= */
  function init() {
    load();
    buildKeyboard();
    setLevel(state.level);
    syncTools();
    bindTools();
    restart();

    window.addEventListener('keydown', onKeyDown, { passive: false });
    window.addEventListener('blur', function () { state.lastTs = 0; });
    window.addEventListener('beforeunload', function () { finalizeSession(); save(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) save();
    });

    setInterval(function () {
      if (state.running) renderStats();
    }, 250);

    elBest.textContent = String(Math.round(state.best));
  }

  init();
})();
</script>
</body>
</html>
